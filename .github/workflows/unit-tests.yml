name: Unit tests

on:
    pull_request:
        branches: [ master, main, stable-* ]
    push:
        branches: [ master, main, stable-* ]

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: unit-tests-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        # a hanging test otherwise holds the check at "in progress" for GitHub's 6h default
        timeout-minutes: 30
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -   name: Set up JDK 21
                uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
                with:
                    distribution: "temurin"
                    java-version: 21

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

            -   name: Run unit tests with coverage
                # a step timeout fails the step, where a job timeout only cancels it
                timeout-minutes: 20
                run: |
                    # thread dump of the test JVM, printed below if the run is still going by then
                    (
                        sleep 720
                        for pid in $(jps -l | awk '/GradleWorkerMain/ {print $1}'); do jstack "$pid"; done
                    ) > "$RUNNER_TEMP/thread-dump.txt" 2>&1 < /dev/null &
                    ./gradlew --no-daemon testGplayDebugUnit

            -   name: Print thread dump
                if: ${{ failure() }}
                run: cat "$RUNNER_TEMP/thread-dump.txt" 2>/dev/null || echo "no thread dump was taken"

            -   name: Upload test artifacts
                if: ${{ failure() }}
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                with:
                    name: test-results
                    path: app/build/reports/tests/testGplayDebugUnitTest/
