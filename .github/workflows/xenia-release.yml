name: "Xenia Release"

on:
  push:
    tags:
      # CalVer release tags, matching the versionName scheme already used in
      # app/build.gradle.kts (defaultConfig versionCode/versionName), e.g. 26.9.26.0.
      - "[0-9]*.[0-9]*.[0-9]*.[0-9]*"

# Declare default permissions as read only.
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: 21

      - name: Gradle validate
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Same CalVer scheme as files-android's app/build.gradle.kts: versionName is the
      # tag itself (YY.M.D.ID), versionCode is the date-encoded integer YYMMDDID with
      # the ID zero-padded to 3 digits. Keyed off the "CalVer YY.M.D.ID" marker comment
      # so only defaultConfig (not the qa flavor override) is touched; versionCode and
      # versionName must be the two lines directly after it.
      - name: Derive CalVer version from tag
        id: calver
        run: |
          TAG="${GITHUB_REF_NAME}"
          IFS='.' read -r YY M D ID <<< "$TAG"
          VERSION_NAME="$TAG"
          VERSION_CODE=$(printf '%02d%02d%02d%03d' "$YY" "$M" "$D" "$ID")
          echo "version-name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          sed -i "/CalVer YY.M.D.ID/{n;s/versionCode = .*/versionCode = ${VERSION_CODE}/;n;s/versionName = .*/versionName = \"${VERSION_NAME}\"/}" app/build.gradle.kts
          grep -qx "        versionCode = ${VERSION_CODE}" app/build.gradle.kts && grep -qx "        versionName = \"${VERSION_NAME}\"" app/build.gradle.kts \
            || { echo "::error file=app/build.gradle.kts::CalVer sed did not set versionCode ${VERSION_CODE} / versionName ${VERSION_NAME}"; exit 1; }

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          ./gradlew --no-daemon bundleGplayRelease

      - name: Remove decoded keystore
        if: ${{ always() }}
        run: rm -f "${ANDROID_KEYSTORE_PATH}"

      - name: Archive AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talk-android-release-aab
          path: app/build/outputs/bundle/gplayRelease/*.aab
          retention-days: 5

  # Build/signing above runs unattended. Publishing to Google Play requires manual
  # approval via the play-release GitHub Environment (a required reviewer must approve
  # the job before it starts). The environment's required-reviewers list itself is a
  # repo-settings change and is not configured by this workflow file.
  upload-google-play:
    needs: release
    runs-on: ubuntu-latest
    environment: play-release
    steps:
      - name: Download AAB build artifact
        uses: actions/download-artifact@v4
        with:
          name: talk-android-release-aab
          path: app/build/outputs/bundle/gplayRelease

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          packageName: eu.xeniacloud.talk
          releaseFiles: app/build/outputs/bundle/gplayRelease/*.aab
          track: internal
          status: completed
